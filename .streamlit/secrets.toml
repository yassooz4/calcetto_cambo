# ==============================================================================
# ESEMPIO DI CONFIGURAZIONE DEI SEGRETI PER GOOGLE SHEETS
# ==============================================================================
# Per attivare la connessione reale a Google Sheets:
# 1. Crea un Service Account su Google Cloud Console (IAM & Admin -> Service Accounts).
# 2. Crea e scarica una chiave JSON per il Service Account.
# 3. Condividi il tuo Google Sheet con l'indirizzo email del Service Account (con permessi 'Editor').
# 4. Copia questo file in .streamlit/secrets.toml (oppure inserisci il contenuto nella sezione Secrets di Streamlit Cloud)
#    e compila i campi sottostanti con i dati del file JSON e l'URL del tuo foglio.
# ==============================================================================

[connections.gsheets]
spreadsheet = "https://docs.google.com/spreadsheets/d/TUO_ID_FOGLIO_GOOGLE/edit"
type = "service_account"
project_id = "tuo-progetto-id"
private_key_id = "tuo-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nTUACHIAVEPRIVATA...\n-----END PRIVATE KEY-----\n"
client_email = "tuo-service-account@tuo-progetto.iam.gserviceaccount.com"
client_id = "123456789012345678901"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/tuo-service-account%40tuo-progetto.iam.gserviceaccount.com"
